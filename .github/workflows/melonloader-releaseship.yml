# Builds all three flavors (ReleaseShip): Loader=MelonLoader / BepInEx / Universal. On v* tags it
# publishes the renamed DLLs (bugtopia-melonloader.dll / bugtopia-bepinex.dll / bugtopia-universal.dll)
# to the GitHub release. Universal works under either loader; the single-loader builds need only that
# loader. Build deps come from unified-ci-deps.zip on the 'deps' release (regenerate with
# ci/prepare-ci-deps.ps1 from an install that has both loaders).
name: ReleaseShip

# Tags only. Every step here exists to produce a release, and the two NativeAOT publishes at the
# end are minutes each, so running the lot on every push earns nothing. Use workflow_dispatch to
# exercise it without cutting a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deps_url:
        description: Optional override URL for unified-ci-deps.zip
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crash-hardening lint
        shell: pwsh
        run: pwsh ci/crash-hardening-lint.ps1

      # 6.0 for the mod and the launcher's interop shim, 8.0 for the launcher itself, which is
      # net8.0-windows and published with NativeAOT.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore build dependencies
        shell: pwsh
        env:
          DEPS_URL_SECRET: ${{ secrets.MELONLOADER_CI_DEPS_URL }}
          DEPS_URL_INPUT: ${{ github.event.inputs.deps_url }}
          # Read by `gh` below. The deps download used to be an anonymous API call, which is 60
          # requests/hour per IP — and runner IPs are shared, so it failed on someone else's
          # traffic. contents:write above already grants the read this needs.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $depsRoot = Join-Path $env:GITHUB_WORKSPACE "ci\heartopia"
          $zipPath = Join-Path $env:RUNNER_TEMP "unified-ci-deps.zip"
          $depsUrl = if ($env:DEPS_URL_INPUT) { $env:DEPS_URL_INPUT } else { $env:DEPS_URL_SECRET }

          $haveZip = $false

          if ($depsUrl) {
            Write-Host "Downloading build dependencies from the configured URL..."
            Invoke-WebRequest -Uri $depsUrl -OutFile $zipPath
            $haveZip = $true
          }
          else {
            # gh is preinstalled on GitHub-hosted runners and picks up GH_TOKEN by itself, so this
            # one command replaces an anonymous API lookup plus a signed-URL download. It also
            # fetches the asset THROUGH the API, which keeps working if the repo ever goes private
            # (browser_download_url does not).
            Write-Host "Downloading build dependencies from the 'deps' release..."
            try {
              gh release download deps `
                --repo $env:GITHUB_REPOSITORY `
                --pattern "unified-ci-deps.zip" `
                --output $zipPath `
                --clobber
              $haveZip = ($LASTEXITCODE -eq 0)
            }
            catch {
              # Depending on the pwsh version a failing native command either sets $LASTEXITCODE or
              # throws ($PSNativeCommandUseErrorActionPreference), so both are handled — otherwise
              # a missing release would surface as a stack trace instead of the guidance below.
              Write-Host "gh release download failed: $($_.Exception.Message)"
              $haveZip = $false
            }
          }

          if (-not $haveZip) {
            throw @"
          Unified CI dependencies are not configured.
          1. Run: pwsh ci/prepare-ci-deps.ps1 -HeartopiaDir '<Game>'   (needs an install with BOTH loaders)
          2. Upload ci/unified-ci-deps.zip to the GitHub release tagged deps, or
          3. Set repository secret MELONLOADER_CI_DEPS_URL to a direct download URL.
          "@
          }

          Expand-Archive -Path $zipPath -DestinationPath $depsRoot -Force

          $required = @(
            "MelonLoader\net6\MelonLoader.dll",
            "MelonLoader\net6\Il2CppInterop.Runtime.dll",
            "MelonLoader\Il2CppAssemblies\Il2Cppmscorlib.dll",
            "BepInEx\core\BepInEx.Core.dll",
            "BepInEx\core\BepInEx.Unity.IL2CPP.dll",
            "BepInEx\core\MonoMod.RuntimeDetour.dll",
            "BepInEx\core\0Harmony.dll",
            "BepInEx\interop\Il2Cppmscorlib.dll",
            # Added with Settings->Game Keys. Listed here so a STALE archive fails at this step with
            # the regenerate instructions, instead of as a puzzling CS0234 three steps later.
            "BepInEx\interop\Unity.InputSystem.dll",
            "MelonLoader\Il2CppAssemblies\Unity.InputSystem.dll",
            # Added with the Aura Farm walk-to-node mode (UnityEngine.AI.NavMesh path following).
            "BepInEx\interop\UnityEngine.AIModule.dll",
            "MelonLoader\Il2CppAssemblies\UnityEngine.AIModule.dll"
          )
          foreach ($rel in $required) {
            $path = Join-Path $depsRoot $rel
            if (-not (Test-Path $path)) {
              throw "Dependency archive is missing required file: $rel (regenerate unified-ci-deps.zip with ci/prepare-ci-deps.ps1 from an install that has both loaders)."
            }
          }

      # Built FIRST and staged immediately: OutputPath is bin\<Loader>\<Configuration>\, so each of
      # these shares a folder with its regular build below and would otherwise be overwritten by
      # it. Copying them out before those builds run is simpler and less fragile than fighting
      # MSBuild over the output path.
      #
      # Universal ships as a DLL of its own; BepInEx goes inside the offline-nolink launcher.
      - name: Build Universal and BepInEx without the Telegram link (Telegram=false)
        shell: pwsh
        run: |
          $deps = "${{ github.workspace }}\ci\heartopia"
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($loader in 'Universal', 'BepInEx') {
            Write-Host "::group::Build $loader (no link)"
            dotnet build buddy/buddy.csproj `
              -c ReleaseShip `
              -p:Loader=$loader `
              -p:Telegram=false `
              -p:HeartopiaDir="$deps" `
              -p:ContinuousIntegrationBuild=true `
              --nologo
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $loader (Telegram=false)" }
            Write-Host "::endgroup::"
            $name = $loader.ToLowerInvariant()
            Copy-Item buddy/bin/$loader/ReleaseShip/bugtopia.dll dist/bugtopia-$name-nolink.dll
            Copy-Item buddy/bin/$loader/ReleaseShip/bugtopia.pdb dist/bugtopia-$name-nolink.pdb
          }

      # Guards the guarantee. FEATURE_TELEGRAM strips the code AND its string literals, but only
      # for code that is actually inside the #if — a future edit could reintroduce the URL outside
      # it and nobody would notice. This fails the build instead.
      # NOTE: .NET stores user string literals as UTF-16LE (metadata names are UTF-8), so an
      # ASCII-only search reports a false clean. Both encodings are checked.
      #
      # ⚠️ And UTF-16 must be decoded at BOTH byte alignments. Entries in the #US heap are only
      # byte-aligned, so a literal can start at an odd offset — and Encoding.Unicode.GetString
      # walks from byte 0 in 2-byte units, which makes every odd-aligned string invisible to it.
      # Adding unrelated code shifts the heap and silently flips a string's parity, so this is not
      # a rare case: it is a coin toss per build. Here that would be a FALSE CLEAN on the exact
      # guarantee this step exists to make.
      - name: Verify the no-link builds have no Telegram traces
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $needles = @('t.me', 'bugtopiamod', 'Telegram', 'Bugtopia News', 'OpenURL')
          foreach ($file in 'bugtopia-universal-nolink.dll', 'bugtopia-bepinex-nolink.dll') {
            $bytes = [System.IO.File]::ReadAllBytes("dist/$file")
            $text8   = [System.Text.Encoding]::UTF8.GetString($bytes)
            $text16a = [System.Text.Encoding]::Unicode.GetString($bytes)
            $text16b = [System.Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1)
            $bad = @()
            foreach ($n in $needles) {
              if ($text8.Contains($n))   { $bad += "$n (utf-8)" }
              if ($text16a.Contains($n) -or $text16b.Contains($n)) { $bad += "$n (utf-16)" }
            }
            if ($bad.Count -gt 0) {
              throw "$file still contains: $($bad -join ', '). Something referencing the link sits OUTSIDE #if FEATURE_TELEGRAM."
            }
            Write-Host "No Telegram traces found in $file."
          }

      - name: Build all flavors (MelonLoader, BepInEx, Universal)
        shell: pwsh
        run: |
          $deps = "${{ github.workspace }}\ci\heartopia"
          foreach ($loader in 'MelonLoader', 'BepInEx', 'Universal') {
            Write-Host "::group::Build $loader"
            dotnet build buddy/buddy.csproj `
              -c ReleaseShip `
              -p:Loader=$loader `
              -p:HeartopiaDir="$deps" `
              -p:ContinuousIntegrationBuild=true `
              --nologo
            if ($LASTEXITCODE -ne 0) { throw "Build failed for Loader=$loader" }
            Write-Host "::endgroup::"
          }

      # Positive control for the check above: if the link ever silently stopped shipping in the
      # normal builds, the "no traces" test would still pass and prove nothing.
      - name: Verify the regular Universal build DOES contain the link
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bytes = [System.IO.File]::ReadAllBytes("buddy/bin/Universal/ReleaseShip/bugtopia.dll")
          # Both alignments — see the note on the step above. This check failed for exactly that
          # reason: the URL was present all along, at an odd offset.
          $text16a = [System.Text.Encoding]::Unicode.GetString($bytes)
          $text16b = [System.Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1)
          if (-not ($text16a.Contains('bugtopiamod') -or $text16b.Contains('bugtopiamod'))) {
            throw "The regular Universal build is missing the Bugtopia News link — Telegram=true is the default, so this should never happen."
          }
          Write-Host "Link present in the regular build, as expected."

      - name: Stage renamed release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item buddy/bin/MelonLoader/ReleaseShip/bugtopia.dll dist/bugtopia-melonloader.dll
          Copy-Item buddy/bin/BepInEx/ReleaseShip/bugtopia.dll     dist/bugtopia-bepinex.dll
          Copy-Item buddy/bin/Universal/ReleaseShip/bugtopia.dll   dist/bugtopia-universal.dll
          Copy-Item buddy/bin/MelonLoader/ReleaseShip/bugtopia.pdb dist/bugtopia-melonloader.pdb
          Copy-Item buddy/bin/BepInEx/ReleaseShip/bugtopia.pdb     dist/bugtopia-bepinex.pdb
          Copy-Item buddy/bin/Universal/ReleaseShip/bugtopia.pdb   dist/bugtopia-universal.pdb

      # The launcher, after the mod is staged: its offline build embeds dist\bugtopia-bepinex.dll,
      # so it carries the exact file this release publishes rather than a second copy of it.
      - name: Build the launcher's native bootstrap
        shell: cmd
        run: launcher\BugtopiaInject\build.bat

      - name: Build the interop shim
        shell: pwsh
        run: |
          dotnet build launcher/BugtopiaInterop/BugtopiaInterop.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Building the interop shim failed." }

      # Twice: the Photino page, then the native Win32 window, each in all three flavours. The Win32
      # files end in -win32.exe, and each run clears only its own kind from dist\, so neither removes
      # the other's. Every run is checked on its own: a step's result is only its last command's.
      - name: Publish the launcher builds
        shell: pwsh
        run: |
          $label = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $label) { $label = "dev" }
          # The switch is added rather than passed as -Win32:$false: this runs the script in a child
          # pwsh, where arguments arrive as text.
          foreach ($window in @(), @("-Win32")) {
            pwsh ci/publish-launcher.ps1 `
              -OutputDirectory "${{ github.workspace }}\dist" `
              -PluginDll "${{ github.workspace }}\dist\bugtopia-bepinex.dll" `
              -NoLinkPluginDll "${{ github.workspace }}\dist\bugtopia-bepinex-nolink.dll" `
              -VersionLabel $label `
              @window
            if ($LASTEXITCODE -ne 0) { throw "Publishing the launcher builds failed ($(if ($window) { 'Win32' } else { 'Photino' }))." }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bugtopia-releaseship
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $generated = gh api "repos/${{ github.repository }}/releases/generate-notes" `
            -f "tag_name=${{ github.ref_name }}" --jq .body
          $notes = "Four builds:`n- **bugtopia-universal.dll** — one DLL for both loaders (Mods\ or BepInEx\plugins\).`n- **bugtopia-bepinex.dll** — BepInEx only (BepInEx\plugins\).`n- **bugtopia-melonloader.dll** — MelonLoader only (Mods\).`n- **bugtopia-universal-nolink.dll** — same as universal, built without the Bugtopia News link (no URL or channel reference anywhere in the binary).`n`nAnd the launcher, one exe with everything inside it:`n- **Bugtopia-Launcher-*-offline.exe** — carries this release's mod; downloads nothing, ever.`n- **Bugtopia-Launcher-*-online.exe** — carries no mod and fetches the newest release itself.`n- **Bugtopia-Launcher-*-offline-nolink.exe** — the offline launcher, carrying the BepInEx mod built without the Bugtopia News link.`n`nEach launcher also comes as **...-win32.exe**: the same launcher in a native Windows window instead of a WebView2 page - no browser engine and no WebView2 component inside.`n`n$generated"

          # Globbed rather than named: the launcher files carry the version in their names.
          $assets = @(
            "dist/bugtopia-bepinex.dll"
            "dist/bugtopia-melonloader.dll"
            "dist/bugtopia-universal.dll"
            "dist/bugtopia-universal-nolink.dll"
          ) + (Get-ChildItem "dist" -Filter "Bugtopia-Launcher-*.exe" | ForEach-Object { $_.FullName })

          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }}" `
            --notes $notes `
            @assets
